services:
  web:
    build: .
    ports: ["3000:3000"]
    environment:
      MONGO_URL: mongodb://mongo:27017/lab2
    depends_on: [mongo]
    restart: on-failure
    networks: [appnet]
  mongo:
    image: mongo:7
    volumes: [mongo-data:/data/db]
    networks: [appnet]
networks:
  appnet:
    driver: bridge
volumes:
  mongo-data: